name: Deploy Frontend to Rukcom

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-frontend.yml'
      - 'bun.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/frontend/fujipp-frontend/**'

jobs:
  deploy:
    name: Build & Deploy to Rukcom
    runs-on: ubuntu-latest
    environment: Deploy-Frontend-Rukcom

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/frontend/fujipp-frontend
        run: bun run build

      - name: Deploy to Rukcom via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: apps/frontend/fujipp-frontend/dist/
          server-dir: /domains/fujipp.com/public_html/
          dangerous-clean-slate: true
